name: test

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - run: go mod download

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage.txt

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - run: go mod download

      - name: Run Acceptance Tests
        run: mise run test:acceptance

      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-coverage
          path: coverage.txt

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Build binary
        run: go install

      - name: Add terraformrc override
        run: |
          cat << EOF > ~/.terraformrc
          provider_installation {
            dev_overrides {
              "taiidani/jenkins" = "$(go env GOBIN)"
            }
            direct {}
          }
          EOF

      - name: Run Integration Tests
        run: mise run test:integration

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Generate Docs
        run: mise run generate

      - name: Verify directory is clean
        run: test -z "$(git status --porcelain)"

      - name: Error message
        if: failure()
        run: |
          echo ':warning: Generated docs differs from committed docs. Did you forget to run `mise run generate`?' >> $GITHUB_STEP_SUMMARY
